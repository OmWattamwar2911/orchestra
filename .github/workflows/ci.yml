name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Go Vet
        run: go vet ./...

      - name: Build All Go Binaries
        run: go build -v ./...

      - name: Run Core Tests with Race Detector
        run: |
          go test -race -v ./internal/dag ./internal/checker ./internal/evidence ./internal/metrics ./internal/queue ./internal/store ./internal/worker

  frontend-test:
    name: Frontend Build & UI Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Build Frontend Application
        working-directory: web
        run: npm run build

      - name: Run Poster Modernist UI Verifier
        working-directory: web
        run: npm run verify
